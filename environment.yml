name: ribocouple
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy<2
  - scipy
  - pandas
  - matplotlib
  - pillow
  - pyyaml
  - pip
  - dm-tree
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu117
    - --find-links https://data.pyg.org/whl/torch-1.13.0+cu117.html
    - torch==1.13.1+cu117             # wheels: https://download.pytorch.org/whl/cu117 (linux_x86_64)
    - torch-scatter==2.1.0+pt113cu117  # data.pyg.org/whl/torch-1.13.0+cu117
    - torch-sparse==0.6.15+pt113cu117
    - torch-cluster==1.6.0+pt113cu117
    - torch-geometric==2.6.1
    - dgl==1.0.1                      # dglteam cu117 conda build; requires torch1.13+cu117
    - e3nn==0.5.1
    - openbabel==3.2.1
    - prody>=2.4
    - biopython
    - pytorch-lightning
    - hydra-core==1.3.2
    - omegaconf
    - einops
    - opt-einsum
    - networkx
    - tqdm
    - requests
    - psutil
    - antlr4-python3-runtime==4.9.3
    # runtime deps observed on import paths
    - wandb
    - beartype
    - jaxtyping
    - loguru
    - ml-collections
    - viennarna
